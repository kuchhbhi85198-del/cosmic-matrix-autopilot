name: 🌌 Master 24/7 Autopilot (Cosmic Matrix + Viral Gaming)

on:
  workflow_dispatch:
  schedule:
    # 1. Morning Slot: Exactly 09:00 AM IST (03:30 UTC) -> Cosmic 1
    - cron: '30 3 * * *'
    # 2. Afternoon Slot: Exactly 02:00 PM IST (08:30 UTC)
    - cron: '30 8 * * *'
    # 3. Evening Slot: Exactly 06:00 PM IST (12:30 UTC) -> Cosmic 2
    - cron: '30 12 * * *'
    # 4. Night Slot: Exactly 07:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'

# STRICT SINGLETON CONCURRENCY LOCK (Zero overlapping runs allowed!)
concurrency:
  group: master-autopilot-singleton
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-master-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js (for YouTube signature cipher)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🎥 Install FFmpeg & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp imageio-ffmpeg instagrapi schedule requests requests-oauthlib google-api-python-client google-auth-oauthlib python-dotenv Pillow

      - name: 🔐 Restore Authentication Credentials & 5TB GDrive Tokens
        env:
          TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
          GDRIVE_TOKEN_BASE64: ${{ secrets.GDRIVE_TOKEN_BASE64 }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          GAMING_CLIENT_SECRET_JSON: ${{ secrets.GAMING_CLIENT_SECRET_JSON }}
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
          GAMING_TOKEN_PICKLE_BASE64: ${{ secrets.GAMING_TOKEN_PICKLE_BASE64 }}
          GAMING_INSTAGRAM_SESSION: ${{ secrets.GAMING_INSTAGRAM_SESSION }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.META_INSTAGRAM_ACCESS_TOKEN }}
          META_INSTAGRAM_USER_ID: ${{ secrets.META_INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          GAMING_META_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.GAMING_META_INSTAGRAM_ACCESS_TOKEN }}
          GAMING_META_INSTAGRAM_USER_ID: ${{ secrets.GAMING_META_INSTAGRAM_USER_ID }}
          GAMING_FACEBOOK_PAGE_ID: ${{ secrets.GAMING_FACEBOOK_PAGE_ID }}
          GAMING_FACEBOOK_ACCESS_TOKEN: ${{ secrets.GAMING_FACEBOOK_ACCESS_TOKEN }}
        run: |
          mkdir -p logs assets/output assets/clips gaming_bot/logs gaming_bot/assets/output
          
          # Restore Cosmic Tokens
          if [ -n "$TOKEN_PICKLE_BASE64" ]; then
            echo "$TOKEN_PICKLE_BASE64" | base64 -d > token.pickle
          fi
          if [ -n "$GDRIVE_TOKEN_BASE64" ]; then
            echo "$GDRIVE_TOKEN_BASE64" | base64 -d > gdrive_token.pickle
            echo "$GDRIVE_TOKEN_BASE64" | base64 -d > gaming_bot/gdrive_token.pickle
          fi
          if [ -n "$CLIENT_SECRET_JSON" ]; then
            echo "$CLIENT_SECRET_JSON" > client_secret.json
          fi
          if [ -n "$GAMING_CLIENT_SECRET_JSON" ]; then
            echo "$GAMING_CLIENT_SECRET_JSON" > gaming_bot/client_secret.json
          fi
          if [ -n "$INSTAGRAM_SESSION" ]; then
            echo "$INSTAGRAM_SESSION" > instagram_session.json
          fi
          
          # Restore Gaming Tokens
          if [ -n "$GAMING_TOKEN_PICKLE_BASE64" ]; then
            echo "$GAMING_TOKEN_PICKLE_BASE64" | base64 -d > gaming_bot/token.pickle
          fi

          if [ -n "$GAMING_INSTAGRAM_SESSION" ]; then
            echo "$GAMING_INSTAGRAM_SESSION" > gaming_bot/instagram_session.json
          fi
          
          # Restore LinkedIn Environment Variables
          echo "LINKEDIN_ACCESS_TOKEN=$LINKEDIN_ACCESS_TOKEN" >> .env
          echo "LINKEDIN_PERSON_URN=$LINKEDIN_PERSON_URN" >> .env

          # Restore X (Twitter) Environment Variables
          echo "X_API_KEY=$X_API_KEY" >> .env
          echo "X_API_SECRET=$X_API_SECRET" >> .env
          echo "X_ACCESS_TOKEN=$X_ACCESS_TOKEN" >> .env
          echo "X_ACCESS_TOKEN_SECRET=$X_ACCESS_TOKEN_SECRET" >> .env

          # Restore Cosmic Meta Official Zero-Strike Graph API Secrets
          echo "META_INSTAGRAM_ACCESS_TOKEN=$META_INSTAGRAM_ACCESS_TOKEN" >> .env
          echo "META_INSTAGRAM_USER_ID=$META_INSTAGRAM_USER_ID" >> .env
          echo "FACEBOOK_PAGE_ID=$FACEBOOK_PAGE_ID" >> .env
          echo "FACEBOOK_ACCESS_TOKEN=$FACEBOOK_ACCESS_TOKEN" >> .env

          # Restore Gaming Meta Official Zero-Strike Graph API Secrets to gaming_bot/.env
          echo "META_INSTAGRAM_ACCESS_TOKEN=$GAMING_META_INSTAGRAM_ACCESS_TOKEN" >> gaming_bot/.env
          echo "META_INSTAGRAM_USER_ID=$GAMING_META_INSTAGRAM_USER_ID" >> gaming_bot/.env
          echo "FACEBOOK_PAGE_ID=$GAMING_FACEBOOK_PAGE_ID" >> gaming_bot/.env
          echo "FACEBOOK_ACCESS_TOKEN=$GAMING_FACEBOOK_ACCESS_TOKEN" >> gaming_bot/.env

      - name: 🚀 Run Unified 24/7 Master Autopilot (Cosmic + Gaming)
        continue-on-error: true
        run: |
          python unified_master_autopilot.py

      - name: 💾 Commit & Push Extracted History & Logs
        if: always()
        run: |
          git config --global user.name "MasterAutopilot-Bot"
          git config --global user.email "bot@masterautopilot.local"
          git add logs/ gaming_bot/logs/ || true
          git commit -m "Auto-update multi-channel history and logs [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
